<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a2e"/>
      <stop offset="50%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#0f2b4c"/>
    </linearGradient>

    <linearGradient id="winIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b579a"/>
      <stop offset="100%" stop-color="#1e3f75"/>
    </linearGradient>

    <linearGradient id="ctrlNormalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="30%" stop-color="#e9ecef"/>
      <stop offset="100%" stop-color="#dee2e6"/>
    </linearGradient>

    <linearGradient id="ctrlGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58cc02"/>
      <stop offset="100%" stop-color="#43a000"/>
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="shadowWin" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <filter id="shadowPopup" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.15"/>
    </filter>

    <filter id="shadowCtrl" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- Clip path for text highlight reveal -->
    <clipPath id="selectClip">
      <rect x="164" y="278" width="0" height="24" rx="3">
        <animate attributeName="width" 
                 values="0; 0; 372; 372; 372; 0; 0" 
                 keyTimes="0; 0.12; 0.28; 0.88; 0.94; 0.98; 1" 
                 dur="8s" 
                 repeatCount="indefinite" 
                 calcMode="spline"
                 keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
      </rect>
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;family=Segoe+UI:wght@400;600;700&amp;display=swap');
      
      text { font-family: 'Segoe UI', -apple-system, sans-serif; user-select: none; }
      .nunito { font-family: 'Nunito', 'Segoe UI', sans-serif; }

      /* Cursor Animation */
      @keyframes cursorMove {
        0%, 10% { opacity: 0; transform: translate(164px, 280px); }
        12% { opacity: 1; transform: translate(164px, 280px); }
        28% { opacity: 1; transform: translate(536px, 280px); }
        32%, 88% { opacity: 0; transform: translate(536px, 280px); }
        94% { opacity: 1; transform: translate(536px, 280px); }
        98% { opacity: 1; transform: translate(164px, 280px); }
        100% { opacity: 0; transform: translate(164px, 280px); }
      }
      .cursor-group {
        animation: cursorMove 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Ctrl Key Container Animation */
      @keyframes ctrlContainer {
        0%, 28% { opacity: 0; transform: translate(0, 30px); }
        32% { opacity: 1; transform: translate(0, 0); }
        48% { opacity: 1; transform: translate(0, 0); }
        52%, 100% { opacity: 0; transform: translate(0, 20px); }
      }
      .ctrl-container {
        animation: ctrlContainer 8s ease-out infinite;
      }

      /* Ctrl Key Press 1 */
      @keyframes ctrlPress {
        0%, 34% { transform: translateY(0); }
        36%, 38% { transform: translateY(6px); }
        40%, 42% { transform: translateY(0); }
        44%, 46% { transform: translateY(6px); }
        48%, 100% { transform: translateY(0); }
      }
      .ctrl-body {
        animation: ctrlPress 8s ease-in-out infinite;
      }

      /* Ctrl Ring Burst 1 */
      @keyframes ringBurst1 {
        0%, 35% { opacity: 0; transform: scale(0.9); }
        36% { opacity: 0.8; transform: scale(0.95); }
        39%, 100% { opacity: 0; transform: scale(1.35); }
      }
      .ring-1 {
        transform-origin: 400px 415px;
        animation: ringBurst1 8s ease-out infinite;
      }

      /* Ctrl Ring Burst 2 */
      @keyframes ringBurst2 {
        0%, 43% { opacity: 0; transform: scale(0.9); }
        44% { opacity: 0.8; transform: scale(0.95); }
        47%, 100% { opacity: 0; transform: scale(1.35); }
      }
      .ring-2 {
        transform-origin: 400px 415px;
        animation: ringBurst2 8s ease-out infinite;
      }

      /* Tap Badge 1 */
      @keyframes badge1 {
        0%, 35% { opacity: 0; transform: scale(0); }
        37%, 42% { opacity: 1; transform: scale(1.1); }
        43%, 100% { opacity: 0; transform: scale(0); }
      }
      .badge-1 {
        transform-origin: 435px 380px;
        animation: badge1 8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      /* Tap Badge 2 */
      @keyframes badge2 {
        0%, 43% { opacity: 0; transform: scale(0); }
        45%, 50% { opacity: 1; transform: scale(1.1); }
        52%, 100% { opacity: 0; transform: scale(0); }
      }
      .badge-2 {
        transform-origin: 435px 380px;
        animation: badge2 8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      /* Popup Spring In / Out */
      @keyframes popupMotion {
        0%, 45% { opacity: 0; transform: translate(400px, 250px) scale(0.4) rotate(-4deg); }
        48% { opacity: 1; transform: translate(400px, 250px) scale(1.04) rotate(1deg); }
        51% { opacity: 1; transform: translate(400px, 250px) scale(0.98) rotate(-0.5deg); }
        53%, 86% { opacity: 1; transform: translate(400px, 250px) scale(1) rotate(0deg); }
        90%, 100% { opacity: 0; transform: translate(400px, 258px) scale(0.85) rotate(2deg); }
      }
      .popup-box {
        transform-origin: 0px 0px;
        animation: popupMotion 8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      /* Confetti Burst */
      @keyframes confettiExplode {
        0%, 47% { opacity: 0; transform: scale(0.2); }
        49% { opacity: 1; transform: scale(1); }
        54%, 100% { opacity: 0; transform: scale(1.8) translateY(20px); }
      }
      .confetti-group {
        transform-origin: 400px 220px;
        animation: confettiExplode 8s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Background Stage -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid dots -->
  <g opacity="0.1" fill="#ffffff">
    <circle cx="40" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/><circle cx="520" cy="40" r="1.5"/><circle cx="600" cy="40" r="1.5"/><circle cx="680" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/>
    <circle cx="40" cy="460" r="1.5"/><circle cx="120" cy="460" r="1.5"/><circle cx="200" cy="460" r="1.5"/><circle cx="280" cy="460" r="1.5"/><circle cx="360" cy="460" r="1.5"/><circle cx="440" cy="460" r="1.5"/><circle cx="520" cy="460" r="1.5"/><circle cx="600" cy="460" r="1.5"/><circle cx="680" cy="460" r="1.5"/><circle cx="760" cy="460" r="1.5"/>
  </g>

  <!-- Document Window (Word Style) -->
  <g transform="translate(110, 60)" filter="url(#shadowWin)">
    <!-- Window Body -->
    <rect width="580" height="370" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Titlebar -->
    <path d="M 0,8 A 8,8 0 0,1 8,0 L 572,0 A 8,8 0 0,1 580,8 L 580,32 L 0,32 Z" fill="#1e293b"/>
    <rect x="12" y="8" width="16" height="16" rx="3" fill="url(#winIconGrad)"/>
    <text x="20" y="20" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">W</text>
    <text x="36" y="20" font-size="12" fill="#cbd5e1" font-weight="500">Article.docx - Word</text>
    
    <!-- Window Controls -->
    <g fill="#94a3b8" font-size="11">
      <text x="500" y="20">─</text>
      <text x="530" y="20">□</text>
      <text x="558" y="20">✕</text>
    </g>

    <!-- Document Content -->
    <g transform="translate(36, 64)">
      <text x="0" y="24" font-size="20" font-weight="700" fill="#0f172a">Getting Started with DoubleTake</text>
      <text x="0" y="48" font-size="11" fill="#94a3b8">Last edited: August 27, 2026 · 3 min read</text>
      <line x1="0" y1="58" x2="508" y2="58" stroke="#e2e8f0" stroke-width="1"/>

      <text x="0" y="86" font-size="13.5" fill="#334155" line-height="1.6">
        <tspan x="0" dy="0">DoubleTake is a lightweight desktop translation companion designed</tspan>
        <tspan x="0" dy="22">for Windows users who need instant translations without disrupting workflow.</tspan>
      </text>

      <!-- Target Selection Sentence (Normal State) -->
      <g transform="translate(0, 138)">
        <text x="0" y="16" font-size="14.5" font-weight="600" fill="#1e293b">DoubleTake brings instant translation to your desktop.</text>
      </g>

      <text x="0" y="184" font-size="13.5" fill="#64748b">
        <tspan x="0" dy="0">With support for 7 major translation engines including Google, Bing,</tspan>
        <tspan x="0" dy="22">and DeepL, you get fast, accurate results right beside your cursor.</tspan>
      </text>
    </g>

    <!-- Highlight Overlay Layer (Clipped dynamically) -->
    <g clip-path="url(#selectClip)" transform="translate(36, 64)">
      <rect x="0" y="136" width="372" height="24" rx="3" fill="#2563eb"/>
      <text x="0" y="154" font-size="14.5" font-weight="600" fill="#ffffff">DoubleTake brings instant translation to your desktop.</text>
    </g>
  </g>

  <!-- Animated Cursor Arrow -->
  <g class="cursor-group">
    <path d="M 0,0 L 0,17.5 L 4.8,12.7 L 11.5,12.7 L 12,12.2 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" filter="drop-shadow(1px 2px 3px rgba(0,0,0,0.3))"/>
  </g>

  <!-- Cartoon Ctrl Key Component -->
  <g class="ctrl-container" transform="translate(400, 415)">
    <!-- Shockwave Rings -->
    <rect class="ring-1" x="-46" y="-46" width="92" height="92" rx="20" fill="none" stroke="#58cc02" stroke-width="4" opacity="0"/>
    <rect class="ring-2" x="-46" y="-46" width="92" height="92" rx="20" fill="none" stroke="#58cc02" stroke-width="4" opacity="0"/>

    <g class="ctrl-body" filter="url(#shadowCtrl)">
      <!-- Key Base Bottom Shadow -->
      <rect x="-42" y="-36" width="84" height="84" rx="16" fill="#6c757d"/>
      
      <!-- Key Top Cap -->
      <rect x="-42" y="-42" width="84" height="80" rx="16" fill="url(#ctrlNormalGrad)" stroke="#adb5bd" stroke-width="2.5"/>
      
      <text class="nunito" x="0" y="-4" font-size="20" font-weight="800" fill="#343a40" text-anchor="middle" letter-spacing="0.5">Ctrl</text>
      <text class="nunito" x="0" y="14" font-size="9" font-weight="700" fill="#868e96" text-anchor="middle" letter-spacing="1">CONTROL</text>

      <!-- Badge "1" -->
      <g class="badge-1" transform="translate(34, -36)">
        <circle cx="0" cy="0" r="13" fill="#58cc02" stroke="#ffffff" stroke-width="2"/>
        <text class="nunito" x="0" y="4.5" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
      </g>

      <!-- Badge "2" -->
      <g class="badge-2" transform="translate(34, -36)">
        <circle cx="0" cy="0" r="13" fill="#58cc02" stroke="#ffffff" stroke-width="2"/>
        <text class="nunito" x="0" y="4.5" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
      </g>
    </g>
  </g>

  <!-- Confetti Elements -->
  <g class="confetti-group">
    <circle cx="340" cy="180" r="4" fill="#58cc02"/>
    <rect x="460" y="170" width="7" height="7" rx="1" fill="#ffc800" transform="rotate(25 460 170)"/>
    <circle cx="320" cy="250" r="3.5" fill="#1cb0f6"/>
    <rect x="480" y="240" width="6" height="6" rx="1.5" fill="#a855f7" transform="rotate(45 480 240)"/>
    <circle cx="400" cy="150" r="4" fill="#ff4b4b"/>
    <rect x="360" y="160" width="5" height="5" rx="1" fill="#ff7eb9" transform="rotate(15 360 160)"/>
    <circle cx="440" cy="160" r="3" fill="#58cc02"/>
  </g>

  <!-- Translation Quick Popup Window -->
  <g class="popup-box">
    <g transform="translate(-190, -115)" filter="url(#shadowPopup)">
      <!-- Frosted Dark Card -->
      <rect width="380" height="230" rx="14" fill="#1e222d" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
      
      <!-- Top Glow Border Accent -->
      <path d="M 14,0 L 366,0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

      <!-- Header -->
      <g transform="translate(16, 16)">
        <rect x="0" y="0" width="20" height="20" rx="5" fill="url(#starGrad)"/>
        <text x="10" y="14" font-size="11" fill="#ffffff" text-anchor="middle">★</text>
        <text class="nunito" x="28" y="15" font-size="13" font-weight="700" fill="#f1f5f9">DoubleTake</text>
        
        <!-- Engine Badge -->
        <rect x="260" y="0" width="54" height="18" rx="4" fill="rgba(255,255,255,0.08)"/>
        <text x="287" y="13" font-size="10.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Bing ▾</text>

        <text x="338" y="14" font-size="12" fill="#64748b">✕</text>
      </g>
      <line x1="0" y1="46" x2="380" y2="46" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <!-- Source Text Preview -->
      <g transform="translate(18, 62)">
        <rect x="0" y="0" width="344" height="22" rx="4" fill="rgba(37,99,235,0.15)"/>
        <text x="8" y="15" font-size="12" font-weight="500" fill="#93c5fd">DoubleTake brings instant translation to your desktop.</text>
      </g>

      <!-- Language Pill Bar -->
      <g transform="translate(18, 98)">
        <rect x="0" y="0" width="96" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text class="nunito" x="12" y="15" font-size="11" font-weight="800" fill="#ffffff">EN</text>
        <text x="36" y="15" font-size="11" fill="#94a3b8">English</text>

        <text x="108" y="15" font-size="12" fill="#64748b">➔</text>

        <rect x="126" y="0" width="96" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text class="nunito" x="138" y="15" font-size="11" font-weight="800" fill="#ffffff">ZH</text>
        <text x="162" y="15" font-size="11" fill="#94a3b8">Chinese</text>
      </g>

      <!-- Translated Result -->
      <g transform="translate(18, 148)">
        <text x="0" y="0" font-size="16.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
          DoubleTake 为您的桌面带来即时翻译
        </text>
      </g>

      <!-- Footer Bar -->
      <line x1="0" y1="184" x2="380" y2="184" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <g transform="translate(18, 196)">
        <circle cx="4" cy="10" r="3" fill="#4ade80"/>
        <text x="14" y="13" font-size="10.5" fill="#64748b">Bing Engine · 128ms</text>

        <g transform="translate(230, 0)">
          <rect x="0" y="0" width="48" height="20" rx="4" fill="rgba(255,255,255,0.08)"/>
          <text x="24" y="13.5" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="middle">Copy</text>

          <rect x="54" y="0" width="58" height="20" rx="4" fill="#2563eb"/>
          <text x="83" y="13.5" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Replace</text>
        </g>
      </g>
    </g>
  </g>
</svg>