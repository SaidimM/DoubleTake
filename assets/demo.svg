<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>

    <linearGradient id="winIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b579a"/>
      <stop offset="100%" stop-color="#1e3f75"/>
    </linearGradient>

    <linearGradient id="ctrlNormalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="30%" stop-color="#e9ecef"/>
      <stop offset="100%" stop-color="#dee2e6"/>
    </linearGradient>

    <linearGradient id="ctrlPressedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58cc02"/>
      <stop offset="100%" stop-color="#43a000"/>
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Filters / Drop Shadows -->
    <filter id="shadowWin" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="shadowPopup" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>

    <filter id="shadowCtrl" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Clip Path for Dynamic Text Selection Highlight (X=146, Y=236, H=24) -->
    <clipPath id="textSelectClip">
      <rect x="146" y="236" width="0" height="24" rx="3">
        <animate attributeName="width"
                 dur="8s"
                 repeatCount="indefinite"
                 values="0; 0; 378; 378; 378; 0; 0"
                 keyTimes="0; 0.125; 0.30; 0.85; 0.90; 0.95; 1"
                 calcMode="spline"
                 keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;family=Segoe+UI:wght@400;600;700&amp;display=swap');
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
    .nunito { font-family: 'Nunito', 'Segoe UI', sans-serif; }
  </style>

  <!-- Stage Background Canvas -->
  <rect width="800" height="520" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Grid Accents -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="40" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/><circle cx="520" cy="40" r="1.5"/><circle cx="600" cy="40" r="1.5"/><circle cx="680" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/>
    <circle cx="40" cy="480" r="1.5"/><circle cx="120" cy="480" r="1.5"/><circle cx="200" cy="480" r="1.5"/><circle cx="280" cy="480" r="1.5"/><circle cx="360" cy="480" r="1.5"/><circle cx="440" cy="480" r="1.5"/><circle cx="520" cy="480" r="1.5"/><circle cx="600" cy="480" r="1.5"/><circle cx="680" cy="480" r="1.5"/><circle cx="760" cy="480" r="1.5"/>
  </g>

  <!-- 1. Document Window (Word Style) -->
  <g transform="translate(110, 45)" filter="url(#shadowWin)">
    <!-- Window Card Body -->
    <rect width="580" height="385" rx="8" fill="#fafafa" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Titlebar -->
    <path d="M 0,8 A 8,8 0 0,1 8,0 L 572,0 A 8,8 0 0,1 580,8 L 580,32 L 0,32 Z" fill="#202020"/>
    <rect x="12" y="8" width="16" height="16" rx="3" fill="url(#winIconGrad)"/>
    <text x="20" y="20" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">W</text>
    <text x="36" y="20" font-size="12" fill="#d1d5db" font-weight="500">Article.docx - Word</text>
    
    <!-- Window Control Buttons -->
    <g fill="#9ca3af" font-size="11">
      <text x="495" y="20">─</text>
      <text x="525" y="20">□</text>
      <text x="555" y="20">✕</text>
    </g>

    <!-- Document Text Layout -->
    <g transform="translate(36, 56)">
      <text x="0" y="26" font-size="20" font-weight="700" fill="#111827">Getting Started with DoubleTake</text>
      <text x="0" y="50" font-size="11.5" fill="#9ca3af">Last edited: August 27, 2026 · 3 min read</text>
      <line x1="0" y1="60" x2="508" y2="60" stroke="#e5e7eb" stroke-width="1"/>

      <!-- Paragraph 1 -->
      <text x="0" y="86" font-size="13.5" fill="#374151">
        <tspan x="0" dy="0">DoubleTake is a lightweight desktop translation companion designed</tspan>
        <tspan x="0" dy="22">for Windows users who need instant translations without disrupting workflow.</tspan>
      </text>

      <!-- Paragraph 2 (Target Sentence on base document) -->
      <text x="0" y="152" font-size="14.5" font-weight="600" fill="#1e293b">DoubleTake brings instant translation to your desktop.</text>

      <!-- Paragraph 3 -->
      <text x="0" y="194" font-size="13.5" fill="#6b7280">
        <tspan x="0" dy="0">With support for 7 major translation engines including Google, Bing,</tspan>
        <tspan x="0" dy="22">and DeepL, you get fast, accurate results right beside your cursor.</tspan>
      </text>
    </g>
  </g>

  <!-- 2. Text Selection Highlight Layer (Blue Selection + Crisp White Text) -->
  <g clip-path="url(#textSelectClip)">
    <rect x="146" y="236" width="378" height="24" rx="3" fill="#2563eb"/>
    <text x="146" y="253" font-size="14.5" font-weight="600" fill="#ffffff">DoubleTake brings instant translation to your desktop.</text>
  </g>

  <!-- 3. Animated Cursor (Glides exactly along the target line) -->
  <g>
    <animateTransform attributeName="transform"
                      type="translate"
                      dur="8s"
                      repeatCount="indefinite"
                      values="146, 246; 146, 246; 524, 246; 524, 246; 524, 246; 146, 246; 146, 246"
                      keyTimes="0; 0.125; 0.30; 0.85; 0.90; 0.95; 1"
                      calcMode="spline"
                      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    
    <g>
      <animate attributeName="opacity"
               dur="8s"
               repeatCount="indefinite"
               values="0; 1; 1; 0; 0; 1; 0"
               keyTimes="0; 0.10; 0.34; 0.38; 0.88; 0.92; 1"/>
      <!-- Crisp Arrow Pointer -->
      <path d="M 0,0 L 0,19 L 5.2,13.8 L 12.5,13.8 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    </g>
  </g>

  <!-- 4. Cartoon Ctrl Key at Bottom Center (X=400, Y=415) -->
  <g transform="translate(400, 415)">
    <!-- Container Entrance & Exit Animation -->
    <g>
      <animateTransform attributeName="transform"
                        type="translate"
                        dur="8s"
                        repeatCount="indefinite"
                        values="0, 35; 0, 0; 0, 0; 0, 30; 0, 35"
                        keyTimes="0; 0.34; 0.50; 0.54; 1"
                        calcMode="spline"
                        keySplines="0.2 0 0.2 1; 0.2 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
      
      <animate attributeName="opacity"
               dur="8s"
               repeatCount="indefinite"
               values="0; 0; 1; 1; 0; 0"
               keyTimes="0; 0.31; 0.34; 0.50; 0.53; 1"/>

      <!-- Shockwave Ring for Tap 1 -->
      <rect x="-48" y="-48" width="96" height="96" rx="20" fill="none" stroke="#58cc02" stroke-width="4">
        <animate attributeName="opacity"
                 dur="8s"
                 repeatCount="indefinite"
                 values="0; 0; 0.8; 0; 0"
                 keyTimes="0; 0.375; 0.385; 0.415; 1"/>
        <animateTransform attributeName="transform"
                          type="scale"
                          dur="8s"
                          repeatCount="indefinite"
                          values="0.9; 0.9; 0.95; 1.4; 1.4"
                          keyTimes="0; 0.375; 0.385; 0.415; 1"/>
      </rect>

      <!-- Shockwave Ring for Tap 2 -->
      <rect x="-48" y="-48" width="96" height="96" rx="20" fill="none" stroke="#58cc02" stroke-width="4">
        <animate attributeName="opacity"
                 dur="8s"
                 repeatCount="indefinite"
                 values="0; 0; 0.8; 0; 0"
                 keyTimes="0; 0.425; 0.435; 0.465; 1"/>
        <animateTransform attributeName="transform"
                          type="scale"
                          dur="8s"
                          repeatCount="indefinite"
                          values="0.9; 0.9; 0.95; 1.4; 1.4"
                          keyTimes="0; 0.425; 0.435; 0.465; 1"/>
      </rect>

      <!-- Keycap Body with Press Down Motion -->
      <g filter="url(#shadowCtrl)">
        <animateTransform attributeName="transform"
                          type="translate"
                          dur="8s"
                          repeatCount="indefinite"
                          values="0,0; 0,0; 0,6; 0,0; 0,6; 0,0; 0,0"
                          keyTimes="0; 0.375; 0.388; 0.41; 0.438; 0.46; 1"/>

        <!-- Base 3D Extrusion -->
        <rect x="-44" y="-36" width="88" height="84" rx="16" fill="#6b7280"/>

        <!-- Top Cap Face -->
        <rect x="-44" y="-44" width="88" height="82" rx="16" fill="url(#ctrlNormalGrad)" stroke="#9ca3af" stroke-width="2.5">
          <animate attributeName="fill"
                   dur="8s"
                   repeatCount="indefinite"
                   values="url(#ctrlNormalGrad); url(#ctrlNormalGrad); url(#ctrlPressedGrad); url(#ctrlNormalGrad); url(#ctrlPressedGrad); url(#ctrlNormalGrad); url(#ctrlNormalGrad)"
                   keyTimes="0; 0.375; 0.388; 0.41; 0.438; 0.46; 1"/>
        </rect>

        <text class="nunito" x="0" y="-5" font-size="22" font-weight="800" fill="#374151" text-anchor="middle" letter-spacing="0.5">Ctrl</text>
        <text class="nunito" x="0" y="14" font-size="9.5" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="1">CONTROL</text>
      </g>

      <!-- Badge "1" -->
      <g transform="translate(36, -38)">
        <animate attributeName="opacity"
                 dur="8s"
                 repeatCount="indefinite"
                 values="0; 0; 1; 1; 0; 0"
                 keyTimes="0; 0.38; 0.39; 0.425; 0.43; 1"/>
        <animateTransform attributeName="transform"
                          type="scale"
                          dur="8s"
                          repeatCount="indefinite"
                          values="0; 0; 1.15; 1.0; 0; 0"
                          keyTimes="0; 0.38; 0.39; 0.425; 0.43; 1"/>
        <circle cx="0" cy="0" r="14" fill="#58cc02" stroke="#ffffff" stroke-width="2"/>
        <text class="nunito" x="0" y="5" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
      </g>

      <!-- Badge "2" -->
      <g transform="translate(36, -38)">
        <animate attributeName="opacity"
                 dur="8s"
                 repeatCount="indefinite"
                 values="0; 0; 1; 1; 0; 0"
                 keyTimes="0; 0.43; 0.44; 0.49; 0.51; 1"/>
        <animateTransform attributeName="transform"
                          type="scale"
                          dur="8s"
                          repeatCount="indefinite"
                          values="0; 0; 1.15; 1.0; 0; 0"
                          keyTimes="0; 0.43; 0.44; 0.49; 0.51; 1"/>
        <circle cx="0" cy="0" r="14" fill="#58cc02" stroke="#ffffff" stroke-width="2"/>
        <text class="nunito" x="0" y="5" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
      </g>
    </g>
  </g>

  <!-- 5. Confetti Particles Burst -->
  <g transform="translate(400, 245)">
    <g>
      <animate attributeName="opacity"
               dur="8s"
               repeatCount="indefinite"
               values="0; 0; 1; 1; 0; 0"
               keyTimes="0; 0.47; 0.48; 0.52; 0.56; 1"/>
      <animateTransform attributeName="transform"
                        type="scale"
                        dur="8s"
                        repeatCount="indefinite"
                        values="0.2; 0.2; 1.1; 1.6; 2.0; 2.0"
                        keyTimes="0; 0.47; 0.49; 0.52; 0.56; 1"/>
      <circle cx="-90" cy="-60" r="4" fill="#58cc02"/>
      <rect x="80" y="-70" width="7" height="7" rx="1" fill="#ffc800" transform="rotate(25 80 -70)"/>
      <circle cx="-110" cy="20" r="3.5" fill="#1cb0f6"/>
      <rect x="95" y="30" width="6" height="6" rx="1.5" fill="#a855f7" transform="rotate(45 95 30)"/>
      <circle cx="0" cy="-90" r="4" fill="#ff4b4b"/>
      <rect x="-50" y="-80" width="5" height="5" rx="1" fill="#ff7eb9" transform="rotate(15 -50 -80)"/>
      <circle cx="50" cy="-80" r="3.5" fill="#58cc02"/>
    </g>
  </g>

  <!-- 6. Translation Quick Popup Window (Centered at X=400, Y=245) -->
  <g transform="translate(400, 245)">
    <!-- Popup Spring Bounce In / Scale Out -->
    <g>
      <animateTransform attributeName="transform"
                        type="scale"
                        dur="8s"
                        repeatCount="indefinite"
                        values="0.3; 0.3; 1.05; 0.98; 1.0; 1.0; 0.85; 0.3"
                        keyTimes="0; 0.46; 0.49; 0.51; 0.53; 0.84; 0.88; 1"
                        calcMode="spline"
                        keySplines="0.34 1.56 0.64 1; 0.34 1.56 0.64 1; 0.34 1.56 0.64 1; 0.34 1.56 0.64 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>

      <animate attributeName="opacity"
               dur="8s"
               repeatCount="indefinite"
               values="0; 0; 1; 1; 1; 0; 0"
               keyTimes="0; 0.45; 0.48; 0.84; 0.88; 0.90; 1"/>

      <!-- Inner Card Content (Centered at -190, -115 to +190, +115) -->
      <g transform="translate(-190, -115)" filter="url(#shadowPopup)">
        <!-- Frosted Dark Card Body -->
        <rect width="380" height="230" rx="14" fill="#282a2e" fill-opacity="0.95" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        
        <!-- Header Bar -->
        <g transform="translate(16, 16)">
          <rect x="0" y="0" width="20" height="20" rx="5" fill="url(#starGrad)"/>
          <text x="10" y="14" font-size="11" fill="#ffffff" text-anchor="middle">★</text>
          <text class="nunito" x="28" y="15" font-size="13.5" font-weight="700" fill="#f3f4f6">DoubleTake</text>
          
          <!-- Active Engine Dropdown Pill -->
          <rect x="254" y="0" width="60" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
          <text x="284" y="14" font-size="11" font-weight="600" fill="#9ca3af" text-anchor="middle">Bing ▾</text>

          <text x="338" y="14" font-size="12" fill="#6b7280">✕</text>
        </g>
        <line x1="0" y1="46" x2="380" y2="46" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

        <!-- Source Text Box -->
        <g transform="translate(18, 62)">
          <rect x="0" y="0" width="344" height="24" rx="4" fill="rgba(37,99,235,0.2)"/>
          <text x="8" y="16" font-size="12.5" font-weight="500" fill="#93c5fd">DoubleTake brings instant translation to your desktop.</text>
        </g>

        <!-- Language Switcher Bar -->
        <g transform="translate(18, 100)">
          <rect x="0" y="0" width="96" height="22" rx="6" fill="rgba(255,255,255,0.08)"/>
          <text class="nunito" x="12" y="15" font-size="11" font-weight="800" fill="#ffffff">EN</text>
          <text x="36" y="15" font-size="11" fill="#9ca3af">English</text>

          <text x="108" y="15" font-size="12" fill="#6b7280">➔</text>

          <rect x="126" y="0" width="96" height="22" rx="6" fill="rgba(255,255,255,0.08)"/>
          <text class="nunito" x="138" y="15" font-size="11" font-weight="800" fill="#ffffff">ZH</text>
          <text x="162" y="15" font-size="11" fill="#9ca3af">Chinese</text>
        </g>

        <!-- Translated Result -->
        <g transform="translate(18, 150)">
          <text x="0" y="0" font-size="17" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
            DoubleTake 为您的桌面带来即时翻译
          </text>
        </g>

        <!-- Footer Bar -->
        <line x1="0" y1="182" x2="380" y2="182" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <g transform="translate(18, 195)">
          <circle cx="4" cy="10" r="3" fill="#4ade80"/>
          <text x="14" y="13.5" font-size="11" fill="#9ca3af">Bing Engine · 128ms</text>

          <g transform="translate(224, 0)">
            <rect x="0" y="0" width="50" height="22" rx="5" fill="rgba(255,255,255,0.08)"/>
            <text x="25" y="15" font-size="10.5" font-weight="600" fill="#e5e7eb" text-anchor="middle">Copy</text>

            <rect x="58" y="0" width="62" height="22" rx="5" fill="#2563eb"/>
            <text x="89" y="15" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">Replace</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>