<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141E28" />
      <stop offset="60%" stop-color="#0A0E14" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>

    <!-- Ambient Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="65%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Frosted Slate Gradient (Loop 1) -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#94A3B8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#64748B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>

    <!-- Neo-Emerald Neon Gradient (Loop 2) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  
  <!-- Subtle Ambient Core Lighting -->
  <circle cx="310" cy="220" r="170" fill="url(#emeraldGlow)" />

  <!-- ── 1. Frosted Slate / Titanium Loop (Back Layer) ── -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Outer Glow / Soft Edge -->
    <rect x="156" y="96" width="200" height="320" rx="100" 
          fill="none" stroke="url(#slateGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.9" />
    
    <!-- Inner Rim Highlight -->
    <rect x="156" y="96" width="200" height="320" rx="100" 
          fill="none" stroke="#F8FAFC" stroke-width="2" stroke-opacity="0.4" />
  </g>

  <!-- ── 2. Neo-Emerald Neon Loop (Foreground Interlocking Layer) ── -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)" filter="url(#softGlow)">
    <!-- Neon Diffuse Aura -->
    <rect x="156" y="96" width="200" height="320" rx="100" 
          fill="none" stroke="#10B981" stroke-width="52" opacity="0.4" filter="url(#neonBlur)" />
    
    <!-- Solid Vibrant Core Loop -->
    <rect x="156" y="96" width="200" height="320" rx="100" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Specular Highlight Line -->
    <rect x="160" y="100" width="192" height="312" rx="96" 
          fill="none" stroke="#A7F3D0" stroke-width="3" stroke-opacity="0.8" />
  </g>

  <!-- ── 3. Interlocking Glass Intersection Refraction ── -->
  <g opacity="0.85">
    <ellipse cx="256" cy="256" rx="42" ry="42" fill="#047857" opacity="0.4" />
    <path d="M 230 240 Q 256 210 282 240 Q 256 270 230 240 Z" fill="#6EE7B7" opacity="0.6" />
    <circle cx="256" cy="256" r="3" fill="#FFFFFF" opacity="0.9" />
  </g>

</svg>
